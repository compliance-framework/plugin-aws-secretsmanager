version: 2
before:
  hooks:
    - go mod download
    - go mod verify
    - go generate ./...
builds:
  - binary: plugin
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
